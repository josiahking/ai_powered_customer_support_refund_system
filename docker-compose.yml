services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-refund_system}
      POSTGRES_USER: ${POSTGRES_USER:-refund_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_refund_password}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    environment:
      APP_NAME: Refund Support API
      APP_ENV: local
      APP_DEBUG: "true"
      APP_KEY: ${APP_KEY:-}
      APP_URL: http://localhost:8000
      LOG_CHANNEL: stderr
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${POSTGRES_DB:-refund_system}
      DB_USERNAME: ${POSTGRES_USER:-refund_app}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-local_refund_password}
      REFUND_WINDOW_DAYS: ${REFUND_WINDOW_DAYS:-30}
      REFUND_HIGH_VALUE_THRESHOLD_CENTS: ${REFUND_HIGH_VALUE_THRESHOLD_CENTS:-50000}
      ORDER_ACCESS_TTL_MINUTES: ${ORDER_ACCESS_TTL_MINUTES:-15}
      AI_PROVIDER: ${AI_PROVIDER:-gemini}
      AI_MODEL: ${AI_MODEL:-gemini-3.8-flash}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_BASE_URL: ${GEMINI_BASE_URL:-https://generativelanguage.googleapis.com/v1beta}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      AI_TIMEOUT_SECONDS: ${AI_TIMEOUT_SECONDS:-20}
      SUPPORT_USERNAME: ${SUPPORT_USERNAME:-support}
      SUPPORT_PASSWORD: ${SUPPORT_PASSWORD:-}
      SUPPORT_AUTH_TTL_MINUTES: ${SUPPORT_AUTH_TTL_MINUTES:-480}
      SUPPORT_COOKIE_SECURE: ${SUPPORT_COOKIE_SECURE:-false}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      SESSION_DRIVER: file
      CACHE_STORE: file
      QUEUE_CONNECTION: sync
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
    environment:
      BACKEND_API_URL: ${BACKEND_API_URL:-http://backend:8000}
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
    depends_on:
      - backend
    ports:
      - "3000:3000"

volumes:
  postgres-data:
